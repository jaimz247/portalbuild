    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://getportalbuild.com/#organization",
          "name": "PortalBuild",
          "url": "https://getportalbuild.com/",
          "logo": "https://getportalbuild.com/vite.svg",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@getportalbuild.com",
            "contactType": "customer service"
          }
        },
        {
          "@type": "Service",
          "@id": "https://getportalbuild.com/#service",
          "name": "PortalBuild Member Portals",
          "description": "Branded member portals for high-ticket cohort programs — with an operator dashboard showing exactly who's falling behind.",
          "provider": {
            "@id": "https://getportalbuild.com/#organization"
          },
          "areaServed": ["US", "GB", "CA", "AU"],
          "offers": [
            {
              "@type": "Offer",
              "name": "Launch Tier",
              "price": "2497",
              "priceCurrency": "USD",
              "description": "9 core screens, custom branding, member login, up to 30 members."
            },
            {
              "@type": "Offer",
              "name": "Program Tier",
              "price": "3997",
              "priceCurrency": "USD",
              "description": "Includes operator dashboard, unlimited members, onboarding automations & reminders."
            },
            {
              "@type": "Offer",
              "name": "Portfolio Tier",
              "price": "6997",
              "priceCurrency": "USD",
              "description": "Multiple programs & concurrent cohorts, payment & booking embeds, custom integrations."
            }
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://getportalbuild.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How is this different from Skool, Circle or Kajabi?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Those are community platforms — a feed and a course library built for evergreen, open-access membership. Your portal is built specifically for a cohort with a start date, end date, sequence, and milestone tracking. Plus, your portal gives you an operator view that flags at-risk members before they churn."
              }
            },
            {
              "@type": "Question",
              "name": "Do I own it, or am I renting?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You own it. Your database, your domain, your code. The monthly fee covers hosting, platform updates, server infrastructure, support, and two change requests a month."
              }
            },
            {
              "@type": "Question",
              "name": "How long does it actually take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Your free preview arrives within 24 hours of requesting it. Once approved, your full custom program portal goes live in under a week."
              }
            },
            {
              "@type": "Question",
              "name": "What if my cohort starts in two weeks?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Rush delivery is available at +$750 for a 72-hour turnaround. Tell us your date when submitting your preview request."
              }
            },
            {
              "@type": "Question",
              "name": "What happens after the build — how does support work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Two change requests a month, 48-hour response, by email. Anything bigger is quoted separately so you always know the cost."
              }
            },
            {
              "@type": "Question",
              "name": "What if I want to leave?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "It's yours. Three-month minimum on the monthly, then month to month. You keep everything."
              }
            },
            {
              "@type": "Question",
              "name": "Can I add a second cohort or program later?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. New cohort setup is $497. An additional program on the same portal is $1,497."
              }
            },
            {
              "@type": "Question",
              "name": "Is my members' data secure?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every portal runs on your own database with private, signed-URL file storage. Nothing is shared between clients."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
